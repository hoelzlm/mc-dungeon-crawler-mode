plugins {
    id 'java-library'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

sourceSets {
    engine
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.engine
        }
    }
}

dependencies {
    implementation sourceSets.engine.output
    testImplementation sourceSets.engine.output
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.register('checkGradleComments') {
    var gradleFiles = fileTree(dir: projectDir, include: '**/*.gradle', exclude: ['build/**', '.gradle/**', 'run/**', '.claude/**'])
    inputs.files gradleFiles
    doLast {
        var offences = []
        gradleFiles.each { f ->
            f.readLines().eachWithIndex { line, i ->
                var t = line.trim()
                if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('*')) {
                    offences << "${projectDir.relativePath(f)}:${i + 1}: comment (see docs/adr/0003-no-code-comments.md)"
                }
            }
        }
        if (offences) {
            throw new GradleException(offences.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkGradleComments'
}

jar {
    from sourceSets.engine.output
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'crawl.engine.classes', sourceSets.engine.output.classesDirs.asPath
    systemProperty 'crawl.main.classes', sourceSets.main.output.classesDirs.asPath
    systemProperty 'crawl.source.dirs', ['src/engine/java', 'src/main/java', 'src/test/java'].collect { file(it).path }.join(File.pathSeparator)
    dependsOn 'classes', 'engineClasses'
}

apply from: 'gradle/smoke.gradle'

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
